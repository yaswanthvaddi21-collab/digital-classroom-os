[package]
name = "digital-classroom-os"
version = "0.2.0"
description = "Digital Classroom OS desktop shell"
edition = "2021"
license = "MIT"

[lib]
name = "dcos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
